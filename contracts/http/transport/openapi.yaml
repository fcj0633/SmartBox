openapi: 3.1.1
info:
  title: SmartBox TASK-012 骑手运输接口增量
  version: 0.1.0
servers:
- url: /api/v1
paths:
  /rider/transports:
    post:
      operationId: createTransport
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: responses.schema.json#/$defs/CreateRequest
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: responses.schema.json#/$defs/TransportResponse
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: listTransports
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: responses.schema.json#/$defs/TransportListResponse
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /rider/transports/{id}:
    get:
      operationId: transportDetail
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: responses.schema.json#/$defs/TransportResponse
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /rider/transports/{id}/item:
    post:
      operationId: saveTransportItem
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: responses.schema.json#/$defs/ItemRequest
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: responses.schema.json#/$defs/TransportResponse
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /rider/transports/{id}/start:
    post:
      operationId: startTransport
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: responses.schema.json#/$defs/StartRequest
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: responses.schema.json#/$defs/TransportResponse
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /rider/transports/{id}/finish:
    post:
      operationId: finishTransport
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: responses.schema.json#/$defs/TransportResponse
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: {$ref: responses.schema.json#/$defs/ErrorResponse}
    Unauthorized:
      description: 未登录或登录过期
      content:
        application/json:
          schema: {$ref: responses.schema.json#/$defs/ErrorResponse}
    Forbidden:
      description: 角色或使用权不符
      content:
        application/json:
          schema: {$ref: responses.schema.json#/$defs/ErrorResponse}
    NotFound:
      description: 任务不存在或不属于本人
      content:
        application/json:
          schema: {$ref: responses.schema.json#/$defs/ErrorResponse}
    Conflict:
      description: 箱体占用、非法状态或需风险确认
      content:
        application/json:
          schema: {$ref: responses.schema.json#/$defs/ErrorResponse}
    Unavailable:
      description: 服务暂不可用
      content:
        application/json:
          schema: {$ref: responses.schema.json#/$defs/ErrorResponse}
