            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 暂不可用
          content:
            application/json:
