            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录或凭据无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 无权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 已先授权但资源不存在
