server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: smartbox-backend
  datasource:
    url: ${SMARTBOX_DB_URL}
    username: ${SMARTBOX_DB_USER}
    password: ${SMARTBOX_DB_PASSWORD}
  flyway:
    url: ${SMARTBOX_MIGRATION_URL}
    user: ${SMARTBOX_MIGRATION_USER}
    password: ${SMARTBOX_MIGRATION_PASSWORD}
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: cn.smartbox.common
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
logging:
  level:
    org.springframework.web: WARN
    cn.smartbox: INFO
